name: C/C++ AppImage

permissions:
  contents: write

on:
  push:
    tags:
      - "*"
jobs:
  build-appimage:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: update
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config glib-2.0 gettext libncurses6 libgpm2 libssh2-1 libaspell15 libext2fs2
      - name: build
        uses: AppImageCrafters/build-appimage-action@master
        with:
          recipe: AppImageBuilder.yml
      - uses: actions/upload-artifact@v4
        with:
          name: AppImage
          path: './*.AppImage*'
      - name: release
        uses: softprops/action-gh-release@v1
        with:
          files: mc-*AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
