version: 1
script:
  # - sudo apt-get update && sudo apt-get install -y autoconf autopoint check gettext libtool pkg-config e2fslibs-dev libaspell-dev libglib2.0-dev libgpm-dev libncurses5-dev libslang2-dev libssh2-1-dev libx11-dev unzip
  - git clone https://github.com/MidnightCommander/mc/
  - cd mc
  - ./autogen.sh
  - ./configure --with-screen=ncurses --enable-werror
  - DESTDIR=$PWD/../AppDir make install
  - cd ../AppDir
  - wget -c https://github.com/MidnightCommander/trac-archive/raw/master/attachments/ticket/4079/mc.svg -O mc.svg
  - mkdir -p usr/share/icons/hicolor/256x256/apps
  - cp mc.svg usr/share/icons/hicolor/256x256/apps
AppDir:
  path: AppDir
  app_info:
    id: mc
    name: mc
    icon: mc
    version: latest
    exec: usr/local/bin/mc
    exec_args: $@
  apt:
    arch:
    - amd64
    allow_unauthenticated: true
    sources:
    - sourceline: deb http://archive.ubuntu.com/ubuntu/ jammy main restricted
    - sourceline: deb http://archive.ubuntu.com/ubuntu/ jammy-updates main restricted
    - sourceline: deb http://archive.ubuntu.com/ubuntu/ jammy universe
    - sourceline: deb http://archive.ubuntu.com/ubuntu/ jammy-updates universe
    - sourceline: deb http://archive.ubuntu.com/ubuntu/ jammy multiverse
    - sourceline: deb http://archive.ubuntu.com/ubuntu/ jammy-updates multiverse
    - sourceline: deb http://security.ubuntu.com/ubuntu jammy-security main restricted
    - sourceline: deb http://security.ubuntu.com/ubuntu jammy-security universe
    - sourceline: deb http://security.ubuntu.com/ubuntu jammy-security multiverse
    - sourceline: deb http://archive.ubuntu.com/ubuntu/ jammy-backports main restricted
        universe multiverse
    - sourceline: deb https://ppa.launchpadcontent.net/polslinux/otpclient/ubuntu/
        jammy main
    - sourceline: deb https://ppa.launchpadcontent.net/hluk/copyq/ubuntu/ jammy main
    - sourceline: deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg]
        https://pkg.cloudflareclient.com/ jammy main
    - sourceline: deb https://ppa.launchpadcontent.net/lubuntu-dev/backports/ubuntu/
        jammy main
    - sourceline: deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg
        arch=amd64] https://brave-browser-apt-release.s3.brave.com/ stable main
    include:
    - libc6:amd64
    - libssh2-1:amd64
  files:
    include: []
    exclude:
    - usr/share/man
    - usr/share/doc/*/README.*
    - usr/share/doc/*/changelog.*
    - usr/share/doc/*/NEWS.*
    - usr/share/doc/*/TODO.*
  test:
    fedora-30:
      image: appimagecrafters/tests-env:fedora-30
      command: ./AppRun
    debian-stable:
      image: appimagecrafters/tests-env:debian-stable
      command: ./AppRun
    archlinux-latest:
      image: appimagecrafters/tests-env:archlinux-latest
      command: ./AppRun
    centos-7:
      image: appimagecrafters/tests-env:centos-7
      command: ./AppRun
    ubuntu-xenial:
      image: appimagecrafters/tests-env:ubuntu-xenial
      command: ./AppRun
AppImage:
  arch: x86_64
  update-information: guess
